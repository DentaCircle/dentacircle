services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dentacircle
      POSTGRES_PASSWORD: dentacircle
      POSTGRES_DB: dentacircle
    ports:
      - "5432:5432"
    volumes:
      - dentacircle_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentacircle -d dentacircle"]
      interval: 5s
      timeout: 5s
      retries: 5

  openwa:
    image: openwa/wa-automate@sha256:d31f5a8f59c4890a302294e9834a25f217a973d80339896ef74cf3d35d903cb3
    profiles: [messaging]
    platform: linux/amd64
    environment:
      PORT: "8080"
      W_A_V: "4.76.0"
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--no-update", "--config", "/config/cli.config.json", "--skip-url-check"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - openwa_session:/sessions
      - ./.openwa/cli.config.json:/config/cli.config.json:ro
    logging:
      driver: none

volumes:
  openwa_session:
  dentacircle_pg:
