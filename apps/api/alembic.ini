[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# Placeholder only. migrations/env.py overwrites this from DATABASE_URL in .env
# (via get_settings() and to_sqlalchemy_url()). Do not edit this to change the DB.
sqlalchemy.url = postgresql://dentacircle:dentacircle@localhost:5432/dentacircle

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
